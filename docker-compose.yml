version: '3'

# ============================================================================
# Superset 6.1.0 (последний релиз) — отдельный стенд, чтобы не мешать
# рабочему инстансу simple-superset-compose.
#
#   web:     http://localhost:8081   (логин/пароль — в .env)
#   образ:   собирается из superset/Dockerfile (apache/superset:6.1.0 + драйверы)
#   данные:  ./superset_home (SQLite-метаданные + кэш)
#
# Команды:
#   bash scripts/up.sh                 — собрать, поднять, дождаться здоровья
#   bash scripts/add-plugin.sh list    — какие драйверы-плагины доступны
#   bash scripts/add-plugin.sh clickhouse   — доустановить драйвер в контейнер
# ============================================================================

services:
  superset:
    init: true
    build:
      context: ./superset
      dockerfile: Dockerfile
    image: superset-latest-app
    container_name: superset_latest
    env_file:
      - .env
    volumes:
      - ./superset_home:/app/superset_home
    ports:
      - '${SUPERSET_HTTP_PORT:-8081}:8088'
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # ==========================================================================
  # PostgreSQL для метаданных — не нужен по умолчанию (используется SQLite).
  # Если захотите переехать: раскомментировать, поставить в .env
  # SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://superset:superset@meta-db:5432/superset
  # и выполнить `bash scripts/rebuild.sh` (образ уже содержит psycopg2).
  # Версию образа обязательно фиксировать: postgres:alpine со временем = новый мажор,
  # который не стартует на данных, созданных предыдущим.
  # ==========================================================================
  # meta-db:
  #   image: postgres:16-alpine
  #   container_name: superset_latest_db
  #   volumes:
  #     - ./postgres_data:/var/lib/postgresql/data
  #   environment:
  #     - POSTGRES_DB=superset
  #     - POSTGRES_USER=superset
  #     - POSTGRES_PASSWORD=superset
